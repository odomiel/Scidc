<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- ==================================================================
       Scidc-Logo. Eigenes Werk, Teil von Scidc und unter derselben
       Lizenz (GNU GPL v2 oder spaeter) wie das uebrige Programm.

       Quelle der ausgelieferten PNG-Dateien: tools/render-icons.tcl
       rastert diese Datei in allen benoetigten Groessen. Nicht die PNGs
       bearbeiten -- der naechste Lauf ueberschreibt sie.

       Diese Fassung hat einen Rand (die Kachel sitzt 2px innerhalb des
       Feldes); scidc-logo-cropped.svg ist randlos fuer die kleinen
       Groessen, wo jedes Pixel zaehlt.

       Gestalterisch: ein Springer als *Figur*, nicht als Tierkopf --
       gestufter Sockel, Halsring darueber, darauf Hals und Kopf. Die
       Ruecklinie bleibt bewusst glatt und ohne Maehnenkerben: Kerben
       saegen bei 16 Pixeln aus und machen die Silhouette unruhig.
       ================================================================== -->

  <!-- Kachel -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="#17497f"/>

  <!-- angedeutete Brettreihe hinter dem Sockel -->
  <g fill="#ffffff" fill-opacity="0.16">
    <rect x="14" y="100" width="24" height="16"/>
    <rect x="62" y="100" width="24" height="16"/>
  </g>

  <!-- Sockel: untere Platte -->
  <path fill="#ffffff" d="M 24 116 L 104 116 L 100 105 L 28 105 Z"/>
  <!-- Sockel: Ring darueber -->
  <path fill="#ffffff" d="M 34 105 L 94 105 L 90 96 L 38 96 Z"/>

  <!-- Figur: Brust, Kehle, Schnauze, Stirn, Ohren, Ruecken -->
  <path fill="#ffffff" d="
    M 44 96
    C 42 82 45 71 52 65
    C 43 66 34 63 27 57
    C 23 54 23 49 28 46
    L 42 38
    C 48 29 56 23 65 20
    L 64 8
    L 75 18
    L 84 7
    L 89 25
    C 96 36 98 50 95 64
    C 92 78 89 88 90 96
    Z"/>

  <!-- Auge und Maul -->
  <circle cx="69" cy="32" r="3.8" fill="#17497f"/>
  <path d="M 36 52 L 27 53" stroke="#17497f" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
